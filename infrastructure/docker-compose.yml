services:
  postgres:
    image: postgres:17-alpine
    container_name: doceenc-postgres
    environment:
      POSTGRES_DB: doceenc-core-db
      POSTGRES_USER: ${DATASOURCE_USERNAME:-doceenc}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:-doceenc}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: