spring:
  application:
    name: doceenc-core-api

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/database}
    username: ${DATASOURCE_USERNAME:username}
    password: ${DATASOURCE_PASSWORD:password}

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false